# AI code review (M5L3): agent z review-agent/ recenzuje diff PR-a,
# komentuje wynik na PR i failuje job przy werdykcie "fail" (bramka).
# Koszt kontrolowany: run wyłącznie po dodaniu labela "ai-review" na PR
# (albo ręcznie przez workflow_dispatch) — nigdy automatycznie na push/PR.
name: AI Code Review

on:
  pull_request:
    types: [labeled]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # pełna historia — diff liczymy względem brancha bazowego
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review-agent/package-lock.json

      - name: Install review-agent deps
        working-directory: review-agent
        run: npm ci

      - name: Compute PR diff
        id: diff
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git diff "origin/${BASE}...HEAD" > pr.diff
          if [ -s pr.diff ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "Diff: $(wc -l < pr.diff) linii względem origin/${BASE}"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pusty diff względem origin/${BASE} — pomijam review."
          fi

      - name: Run review agent
        if: steps.diff.outputs.empty == 'false'
        working-directory: review-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # JSON na stdout -> review.json (bramka + komentarz); ludzkie podsumowanie
        # agent wypisuje na stderr, więc trafia do logów joba.
        run: npx tsx review.ts "$GITHUB_WORKSPACE/pr.diff" > "$GITHUB_WORKSPACE/review.json"

      - name: Comment review on PR
        if: github.event_name == 'pull_request' && steps.diff.outputs.empty == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { review: r, metrics: m } = JSON.parse(
              fs.readFileSync("review.json", "utf8"),
            );
            const verdict = r.verdict === "pass" ? "✅ **PASS**" : "❌ **FAIL**";
            const body = [
              "## 🤖 AI Code Review",
              "",
              `Werdykt: ${verdict}`,
              "",
              "| Kryterium | Ocena |",
              "| --- | --- |",
              `| Poprawność implementacji | ${r.implementationCorrectness}/10 |`,
              `| Idiomatyczność | ${r.idiomaticity}/10 |`,
              `| Złożoność | ${r.complexity}/10 |`,
              `| Pokrycie testami | ${r.testRiskCoverage}/10 |`,
              `| Bezpieczeństwo | ${r.securitySafety}/10 |`,
              "",
              r.summary,
              "",
              `<sub>koszt: $${m.costUsd.toFixed(4)} · ${m.numTurns} tury · ${(m.durationMs / 1000).toFixed(1)}s · tokeny: ${m.inputTokens} in / ${m.outputTokens} out · kryteria: review-agent/review-criteria.md</sub>`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Gate on verdict
        if: steps.diff.outputs.empty == 'false'
        run: |
          VERDICT=$(jq -r '.review.verdict' review.json)
          echo "Werdykt agenta: ${VERDICT}"
          if [ "$VERDICT" != "pass" ]; then
            echo "::error::AI code review odrzuciło zmianę (verdict=${VERDICT})."
            exit 1
          fi
